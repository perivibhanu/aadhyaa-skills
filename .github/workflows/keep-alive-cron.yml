name: Keep Backend Alive Cron

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://aadhyaa-skills-backend.onrender.com/api/health || echo "Ping completed"

